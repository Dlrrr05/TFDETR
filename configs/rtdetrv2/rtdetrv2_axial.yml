__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_axial


# ---------------------------------------------------
# Top-level model
# ---------------------------------------------------
RTDETR:
  backbone: AxialCNNTransformerBackbone
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2


# ---------------------------------------------------
# Backbone: CNN shallow + axial transformer deep
# ---------------------------------------------------
AxialCNNTransformerBackbone:
  in_channels: 3
  stem_dim: 64
  stage_dims: [64, 128, 256]
  depth_cnn: 2
  depth_freq: 2
  depth_time: 2
  num_heads: [4, 8]
  ff_mult: 4
  conv_kernel_size: 7
  attn_dropout: 0.1
  proj_dropout: 0.1
  drop_path: 0.05
  use_se: True
  use_stage_fusion: True
  use_gated_fusion: False
  act: silu
  return_idx: [0, 1, 2]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  max_freq_positions: 256
  max_time_positions: 1024


# ---------------------------------------------------
# Encoder
# ---------------------------------------------------
HybridEncoder:
  in_channels: [64, 128, 256]
  hidden_dim: 256
  expansion: 0.5


# ---------------------------------------------------
# Decoder
# ---------------------------------------------------
RTDETRTransformerv2:
  num_layers: 4


# ---------------------------------------------------
# Training schedule
# ---------------------------------------------------
epoches: 300


# ---------------------------------------------------
# Optimizer
# Strategy:
# - backbone: small lr
# - encoder/decoder norm|bn|bias: no weight decay
# ---------------------------------------------------
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00005
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# ---------------------------------------------------
# Dataloader
# ---------------------------------------------------
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    stop_epoch: 117
