__include__: [
  '../dataset/coco_detection.yml',
  './runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/ablation/cnn_base

model: RTDETR
criterion: RTDETRCriterionv2
postprocessor: RTDETRPostProcessor

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: False

RTDETR:
  encoder_return_aux: False
  encoder_compute_rank_loss_in_eval: False
  encoder_return_attn_maps: False

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5
  use_encoder_idx: [1]

RTDETRTransformerv2:
  num_layers: 4

RTDETRCriterionv2:
  matcher: HungarianMatcher
  alpha: 0.75
  gamma: 2.0

  rank_regularizer_mode: adaptive
  rank_level_index: 1
  rank_r_tau: 4
  rank_r_nu: 4
  rank_r_loc: 2
  rank_window_h: 1
  rank_window_w: 3
  rank_num_anchors: 32
  rank_return_maps: False

  adaptive_ema_beta: 0.95
  adaptive_warmup_epochs: 5.0
  adaptive_gate_gamma: 5.0
  adaptive_eps: 1.0e-6
  adaptive_stop_gradient: True

  losses: ['vfl', 'boxes']

  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0

HungarianMatcher:
  weight_dict:
    cost_class: 2
    cost_bbox: 5
    cost_giou: 2
  alpha: 0.25
  gamma: 2.0

epoches: 300

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00005
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?!.*(?:norm|bn|bias)).*$'
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    stop_epoch: 117
