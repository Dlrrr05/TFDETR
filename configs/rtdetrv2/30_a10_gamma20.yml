__include__: ['./_base_axial.yml']

output_dir: ./output/ablation/30_a10_gamma20
RTDETR:
  encoder_return_aux: True

RTDETRCriterionv2:
  rank_regularizer_mode: adaptive
  adaptive_ema_beta: 0.95
  adaptive_warmup_epochs: 5.0
  adaptive_gate_gamma: 20.0
  adaptive_stop_gradient: True
  adaptive_update_interval: 50
  losses: ['vfl', 'boxes', 'tau', 'nu', 'tf']
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
    loss_tau: 0.1
    loss_nu: 0.1
    loss_tf: 0.05


