task: detection

model: RTDETR
criterion: RTDETRCriterionv2
postprocessor: RTDETRPostProcessor

use_focal_loss: True
eval_spatial_size: [128, 256]   # h w


# ============================================================
#  Model Structure
# ============================================================

RTDETR: 
  backbone: SpecDCNBackbone
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2


# ============================================================
#  Backbone (你的新骨干)
#  ⚠ 名字必须和类名完全一致，且参数必须和 __init__ 一一对应
# ============================================================

SpecDCNBackbone:
  in_chans: 3
  drop_path_rate: 0.1
  # 已经去除了原先与 ResNet 相关的无用参数，防止 __init__ 报错


# ============================================================
#  Hybrid Encoder
# ============================================================

HybridEncoder:
  in_channels: [128, 256, 512]  # 匹配 stage2, stage3, stage4 的输出维度
  feat_strides: [8, 16, 32]     # 🔥 修改点：匹配骨干网络真实的下采样率

  # intra encoder
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.1
  enc_act: 'gelu'
  
  # cross
  expansion: 0.5
  depth_mult: 1
  act: 'silu'


# ============================================================
#  Transformer Decoder (稳定版本)
# ============================================================

RTDETRTransformerv2:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]     # 🔥 修改点：必须和 Encoder 保持一致
  hidden_dim: 256
  num_levels: 3

  # 🔥 建议减层更稳定
  num_layers: 4

  num_queries: 100

  # 🔥 关闭 denoising 更稳
  num_denoising: 0

  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  eval_idx: -1

  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default


# ============================================================
#  PostProcess
# ============================================================

RTDETRPostProcessor:
  num_top_queries: 300


# ============================================================
#  Loss
# ============================================================

RTDETRCriterionv2:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2

  losses: ['vfl', 'boxes']
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0