__include__: ['./_base_axial.yml']

output_dir: ./output/ablation/32_a12_weight_scale20
RTDETR:
  encoder_return_aux: True

RTDETRCriterionv2:
  rank_regularizer_mode: three_level
  losses: ['vfl', 'boxes', 'tau', 'nu', 'loc']
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
    loss_tau: 0.2
    loss_nu: 0.2
    loss_loc: 0.1
