__include__: [ 
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/specDCN.yml',
]

output_dir: ./output/rtdetrv2_spec2_120e_coco


# ============================================================
# Backbone 替换为 CleanSpecBackbone
# ============================================================

SpecDCNBackbone:
  in_chans: 3
  drop_path_rate: 0.2


# 替换默认 PResNet
backbone: SpecDCNBackbone


# ============================================================
# Hybrid Encoder（必须匹配 backbone 输出通道）
# ============================================================

HybridEncoder:
  in_channels: [128, 256, 512]   # 对应 1/8 1/16 1/32
  hidden_dim: 256
  expansion: 0.5


# ============================================================
# Transformer
# ============================================================

RTDETRTransformerv2:
  num_layers: 4


# ============================================================
# 训练设置
# ============================================================

epoches: 200


optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00005
    - 
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00005
      weight_decay: 0.
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# ============================================================
# 数据增强（保持原始策略）
# ============================================================

train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: 117
  collate_fn:
    stop_epoch: 117