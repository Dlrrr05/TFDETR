__include__: [
  '../dataset/data_rank_10k_bass_detection.yml',
  './runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/Conformer.yml',
]

output_dir: ./output/conformer_lowrank_data_rank_10k_bass

eval_spatial_size: [128, 512]

RTDETR:
  encoder_return_aux: True
  encoder_compute_rank_loss_in_eval: False
  encoder_return_attn_maps: False

ConformerNetBackbone:
  in_chans: 3

RTDETRCriterionv2:
  rank_regularizer_mode: adaptive
  rank_level_index: 2
  rank_r_tau: 4
  rank_r_nu: 4
  rank_r_loc: 2
  rank_window_h: 1
  rank_window_w: 3
  rank_num_anchors: 32
  rank_return_maps: False

  adaptive_ema_beta: 0.95
  adaptive_warmup_epochs: 5.0
  adaptive_gate_gamma: 5.0
  adaptive_eps: 1.0e-6
  adaptive_stop_gradient: True
  adaptive_update_interval: 50

  losses: ['vfl', 'boxes', 'tau', 'nu', 'tf']

  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 2.0
    loss_tau: 0.1
    loss_nu: 0.1
    loss_tf: 0.05
